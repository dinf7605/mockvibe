# ============================================================================
# Production profile — Oracle Autonomous DB (Wallet) + 외부 Redis + Nginx 뒤
# 모든 비밀값은 시스템 환경변수로 주입. .env 파일은 운영에서 사용 금지.
# ============================================================================
spring:
  datasource:
    # Wallet 압축 해제 디렉토리를 TNS_ADMIN으로, tnsnames.ora 별칭을 URL로
    url: jdbc:oracle:thin:@${ORACLE_TNS_NAME}?TNS_ADMIN=${ORACLE_WALLET_DIR}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: SimulatorPool

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # ADB는 항상 시스템 테이블(DBTOOLS$EXECUTION_HISTORY 등)이 ADMIN schema에
    # 존재하므로 Flyway는 "non-empty schema"로 본다. 이 경우 baseline-on-migrate를
    # 끄면 'Found non-empty schema(s) but no schema history table' 에러로 부팅 실패.
    # 따라서 true로 두되, baseline-version=0 으로 V0를 가상 baseline으로 표시하여
    # 실제 V1부터 정상 적용되도록 한다.
    baseline-on-migrate: true
    baseline-version: 0
    # 부팅 시 schema_history의 failed migration entry를 자동 정리 후 재시도.
    # 운영 중 일회성 SQL 실패가 다음 부팅을 막는 무한 루프 방지 (validate 단계 회복).
    repair-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

server:
  # Nginx 리버스 프록시의 X-Forwarded-* 헤더 신뢰 → 쿠키 secure 판정, 리다이렉트 URL 정확
  forward-headers-strategy: framework

logging:
  level:
    com.fintech.simulator: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        # prometheus는 Nginx 레벨에서 사설망/Basic Auth로 보호 권장
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

app:
  cookie:
    secure: true
    same-site: Strict
  # 외부 API: prod에서는 Mock 폴백 비활성 (CB Open 시에만 폴백 동작)
  market:
    mock:
      enabled: false
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
  external:
    kis:
      base-url: https://openapivts.koreainvestment.com:29443
      app-key: ${KIS_APP_KEY}
      app-secret: ${KIS_APP_SECRET}
      mock: true   # KIS 자체는 모의투자 엔드포인트 사용
    finnhub:
      base-url: https://finnhub.io/api/v1
      ws-url: wss://ws.finnhub.io
      api-key: ${FINNHUB_API_KEY}
    fx:
      base-url: https://api.exchangerate-api.com/v4
    # PRD 표기는 Claude이지만 실제는 Gemini로 대체.
    # GEMINI_API_KEY 우선, 없으면 CLAUDE_API_KEY (호환)
    claude:
      base-url: https://api.anthropic.com
      api-key: ${GEMINI_API_KEY:${CLAUDE_API_KEY:}}
