# ============================================================================
# Production compose — EC2 t3.micro (1GB RAM) 가정
# - DB: 외부 Oracle Autonomous Database (Wallet 마운트)
# - Cache: 동일 호스트의 Redis 컨테이너
# - App: GHCR에서 pull (CI에서 자동 푸시)
# - Edge: Nginx + Let's Encrypt (HTTPS, WS 프록시)
#
# 사용법:
#   cd docker
#   docker compose -f docker-compose.prod.yml --env-file ../.env.prod up -d
# ============================================================================
name: mockvibe-prod

services:
  redis:
    image: redis:7-alpine
    container_name: mockvibe-redis
    restart: unless-stopped
    # 외부 노출 금지 — 같은 도커 네트워크 내부에서만 접근
    expose:
      - "6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "200mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    # CI가 main 푸시 시 ghcr.io/dinf7605/mockvibe-backend:latest 갱신
    image: ghcr.io/dinf7605/mockvibe-backend:${APP_TAG:-latest}
    container_name: mockvibe-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # 외부 직접 노출 금지 — Nginx만 접근
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Oracle ADB Wallet
      ORACLE_TNS_NAME:    ${ORACLE_TNS_NAME}
      ORACLE_WALLET_DIR:  /app/oracle-wallet
      DB_USERNAME:        ${DB_USERNAME}
      DB_PASSWORD:        ${DB_PASSWORD}
      # Redis (compose 네트워크 내부 호스트명)
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      REDIS_PASSWORD:     ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET:         ${JWT_SECRET}
      # 도메인 / CORS
      APP_DOMAIN:         ${APP_DOMAIN}
      FRONTEND_URL:       ${FRONTEND_URL}
      # 외부 API
      KIS_APP_KEY:        ${KIS_APP_KEY:-}
      KIS_APP_SECRET:     ${KIS_APP_SECRET:-}
      FINNHUB_API_KEY:    ${FINNHUB_API_KEY:-}
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      # 초기 관리자 (시드 후 비워둘 것)
      ADMIN_INITIAL_EMAIL:    ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # JVM 튜닝 — t3.micro 1GB 중 512MB만 사용
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Seoul"
    volumes:
      # Oracle Wallet (host에서 압축 해제하여 마운트)
      - ../deploy/oracle-wallet:/app/oracle-wallet:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: mockvibe-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../deploy/nginx/snippets:/etc/nginx/snippets:ro
      # certbot --webroot 챌린지 경로
      - certbot-www:/var/www/certbot:ro
      # Let's Encrypt 인증서
      - certbot-etc:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: mockvibe-certbot
    # 12시간마다 갱신 시도 (Let's Encrypt 권장)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt

volumes:
  redis-data:
    name: mockvibe-redis-data
  certbot-www:
    name: mockvibe-certbot-www
  certbot-etc:
    name: mockvibe-certbot-etc
