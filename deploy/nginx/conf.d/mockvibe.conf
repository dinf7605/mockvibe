# ============================================================================
# MockVibe — Nginx 리버스 프록시 (HTTPS + WebSocket)
#
# 환경변수 치환: 운영 부팅 시 `envsubst < mockvibe.conf.template > mockvibe.conf`
# 또는 그대로 두고 ${APP_DOMAIN}만 sed로 치환해 사용.
# (compose에서는 :ro로 마운트되므로 호스트에서 미리 치환된 파일을 마운트할 것)
# ============================================================================

# upstream — compose 네트워크 내부 서비스명
upstream mockvibe_backend {
    server app:8080;
    keepalive 32;
}

# WebSocket 업그레이드를 위한 map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------------
# HTTP — Let's Encrypt 챌린지 통과 + HTTPS 리다이렉트
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN_PLACEHOLDER;

    # certbot --webroot 챌린지 (이게 작동해야 인증서 발급/갱신 가능)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 헬스체크 (nginx 자체)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 그 외 전부 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# HTTPS — 실제 서비스
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name APP_DOMAIN_PLACEHOLDER;

    # Let's Encrypt 인증서 경로 (compose 볼륨)
    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN_PLACEHOLDER/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # 파일 업로드/응답 크기 (기본 1MB는 일부 응답에서 부족)
    client_max_body_size 10m;

    # ------------------------------------------------------------------------
    # REST API
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://mockvibe_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------------
    # WebSocket (STOMP)
    # ------------------------------------------------------------------------
    location /ws {
        proxy_pass http://mockvibe_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket은 장기 연결 — heartbeat 간격(기본 10s)보다 충분히 큰 값
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------------------
    # actuator — 헬스체크만 외부 허용, 그 외(metrics, prometheus)는 사설망/Basic Auth 권장
    # ------------------------------------------------------------------------
    location = /actuator/health {
        proxy_pass http://mockvibe_backend/actuator/health;
        access_log off;
    }
    location /actuator/ {
        # 운영에서는 사설망/VPN IP만 허용
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://mockvibe_backend/actuator/;
    }

    # ------------------------------------------------------------------------
    # Swagger UI / OpenAPI — 데모 편의용 공개
    # ------------------------------------------------------------------------
    location /swagger-ui {
        proxy_pass http://mockvibe_backend/swagger-ui;
    }
    location /v3/api-docs {
        proxy_pass http://mockvibe_backend/v3/api-docs;
    }

    # ------------------------------------------------------------------------
    # 기본
    # ------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        # 백엔드 도메인은 API 전용 — 루트는 프론트엔드(Vercel)로 안내
        return 302 ${FRONTEND_URL_PLACEHOLDER};
    }
}
