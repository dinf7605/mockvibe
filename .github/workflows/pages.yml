name: Docs (MkDocs → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          pip install mkdocs-material==9.5.46

      - name: Build site
        # --strict 는 첫 빌드에서 ../../backend/... 같은 docs 외부 링크에 민감.
        # 일단 비활성. 다음 PR 에서 외부 링크를 GitHub 절대경로로 정리 후 켤 것.
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
