name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 PR의 새 푸시 시 이전 실행 자동 취소 → 러너 절약
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & test
        env:
          # 단위 테스트는 외부 인프라 불필요 — Mock/H2 in-memory 가정
          # 만약 통합 테스트가 Oracle을 요구하면 testcontainers 도입 후 보강
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew --no-daemon clean test bootJar

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Lint (best-effort, 실패해도 빌드는 계속)
        run: npm run lint --if-present || true
